<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>在线客服使用教程</title>
<meta name="description" content="在线客服产品教程：功能概览、所有者 / 管理员 / 客服的角色权限，以及会话工作台、客服管理和各项设置的分步图解。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230369a1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'/%3E%3C/svg%3E">
<script>
  // Apply the saved theme and language before first paint to avoid a flash.
  (function () {
    try {
      var p = new URLSearchParams(location.search);
      var th = p.get('theme') || localStorage.getItem('tutorial:theme');
      if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
      var lg = p.get('lang') || localStorage.getItem('tutorial:lang');
      if (lg === 'en') { document.documentElement.dataset.lang = 'en'; document.documentElement.lang = 'en'; }
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
